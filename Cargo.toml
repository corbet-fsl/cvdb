[package]
name = "cvdb"
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
description = "Database backend for CareerVector workspaces: SQLite store and the byte transport pieces (http, link, live relay, durable outbox)"
license = "FSL-1.1-ALv2"
readme = "README.md"
repository = "https://git.corbet.ch/corbet-fsl/cvdb"
keywords = ["crdt", "sync", "yjs", "cv"]
categories = ["network-programming", "data-structures"]
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE.md", ".cargo/release-profile.toml"]

[features]
default = ["sqlite"]
# The SQLite storage backend (`cvdb::store`), speaking the cvfs record vocabulary.
sqlite = ["dep:rusqlite", "dep:cvfs"]
# An in-process light server for tests of `remote` (no network).
fake-server = []

[dependencies]
cvfs = { version = "0.1", optional = true }
rusqlite = { version = "0.37", features = ["bundled"], optional = true }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
fastrand = "2"
ureq = "3"
socket2 = { version = "0.6", features = ["all"] }
tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
tempfile = "3"
# Integration tests use the in-process light server.
cvdb = { path = ".", features = ["fake-server"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# Intentional: masked byte writes, small exact integers to f64, test assertions on emptiness.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
assert_is_empty = "allow"
format_push_string = "allow"
similar_names = "allow"
needless_pass_by_value = "allow"
unnecessary_wraps = "allow"
